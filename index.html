<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Together</title>
<style>
  :root {
    --canvas: #F7F4ED;
    --surface: #FFFFFF;
    --ink: #17201C;
    --muted: #6F7771;
    --line: #E5E1D8;
    --moss: #325C46;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    padding: 24px 18px 60px;
  }
  main { margin: 0 auto; max-width: 640px; }
  .eyebrow {
    color: var(--moss);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  h1 { font-size: 28px; font-weight: 900; margin: 6px 0 18px; }
  p { font-size: 15px; }
  ul { list-style: none; margin-top: 18px; }
  li {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 10px;
  }
  li a {
    color: var(--moss);
    display: block;
    font-size: 15px;
    font-weight: 700;
    padding: 16px 20px;
    text-decoration: none;
  }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Together</p>
  <h1>Stay close to your circle</h1>
  <p>
    Together is a private location-sharing and chat app for small circles of
    friends — up to five people, invite-only, with sharing you control.
  </p>
  <ul>
    <li><a href="privacy.html">Privacy policy</a></li>
    <li><a href="terms.html">Terms of service</a></li>
    <li><a href="delete-account.html">Delete your account</a></li>
  </ul>
  <footer>Together · Support: ming.life@foxmail.com</footer>
</main>
</body>
</html>
